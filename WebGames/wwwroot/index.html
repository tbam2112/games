<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Totally Not Wordle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="theme-toggle" aria-label="Switch to dark theme">🌙</button>

  <h1>Totally Not Wordle</h1>


  <!-- Screen 1: pick a difficulty and start a game -->
  <section id="setup-screen">
    <h2>Choose a difficulty</h2>

    <label for="word-length">Word length (3-15 letters):</label>
    <input type="number" id="word-length" min="3" max="15" value="5" />

    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="1">Easy</option>
      <option value="3">Medium</option>
      <option value="5">Hard</option>
    </select>

    <label for="language">Language:</label>
    <select id="language">
      <option value="en">English</option>
      <option value="es">Spanish</option>
    </select>

    <button id="start-button">Start Game</button>
    <p id="setup-error" class="error"></p>
  </section>

  <!-- Screen 2: the actual game board -->
  <section id="game-screen" class="hidden">
    <!-- Full grid of tiles — built dynamically when a game starts -->
    <div id="guess-board"></div>

    <p id="game-message"></p>

    <!-- Keyboard tracker: shows which letters have been used and their best result -->
    <div id="keyboard"></div>

  </section>

  <!-- Screen 3: shown after a win or loss -->
  <section id="result-screen" class="hidden">
    <h2 id="result-heading"></h2>
    <p id="result-word"></p>
    <div id="record">Wins: 0 &nbsp; Losses: 0</div>
    <button id="continue-button">Continue (same difficulty)</button>
    <button id="change-difficulty-button">Change Difficulty</button>
    <button id="quit-button">Quit</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
